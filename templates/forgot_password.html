{% extends "base.html" %}
{% set page_title = "UK Transport Hub" %}
{% set home_target = "home" %}
{% set is_drivers_hub = False %}

{% block content %}

<div style="width: 100%; display: flex; justify-content: center; padding-top: 20px;">

    <div style="max-width: 450px; width: 100%; text-align: center;">

        <h2>Reset Your Password</h2>

        <p>Enter your email and we’ll generate a reset link.</p>

        <input 
            type="email" 
            id="email" 
            placeholder="Enter your email"
            style="
                width: 100%;
                padding: 14px;
                font-size: 17px;
                border-radius: 6px;
                border: 1px solid #ccc;
                margin-top: 10px;
            "
        >

        <button 
            onclick="requestReset()" 
            style="
                margin-top: 15px;
                padding: 12px 22px;
                font-size: 17px;
            "
        >
            Send Reset Link
        </button>

        <p id="result" style="margin-top: 15px;"></p>

    </div>

</div>

<script>
async function requestReset() {
    const email = document.getElementById("email").value;

    const response = await fetch("/api/password_reset_request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email })
    });

    const result = await response.json();
    document.getElementById("result").innerText = result.message;
}
</script>

{% endblock %}
