{% extends "base.html" %}

{% block content %}
<p>enthusiast: {{ enthusiast }}</p>

<h2>Delete Account</h2>

<p>Select what you want to delete:</p>

<form action="/confirm-delete" method="POST">

    <!-- Always show Driver option if they have a driver profile/level -->
    <label>
        <input type="checkbox" name="delete_driver" value="yes">
        Delete Driver Account
    </label><br>

    <!-- Always show Enthusiast option if they have an enthusiast profile/level -->
    <label>
        <input type="checkbox" name="delete_enthusiast" value="yes">
        Delete Enthusiast Account
    </label><br>

    <!-- Or a shortcut to tick both -->
    <label>
        <input type="checkbox" name="delete_both" value="yes">
        Delete BOTH Accounts
    </label><br>

    <br>
    <button type="submit">Confirm Delete</button>
    <a href="{{ url_for(home_target) }}">Cancel</a>

</form>

{% endblock %}
