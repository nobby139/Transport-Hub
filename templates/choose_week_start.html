<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Choose Week Start</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
        }

        button {
            background: #1E88E5;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        button:hover {
            background: #1565C0;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Select Your Week Start Day</h2>

    <form method="POST" action="/set-week-start">
        <label for="week_start">Choose the day your company’s week begins:</label>

        <select id="week_start" name="week_start" required>
            <option value="monday">Monday</option>
            <option value="friday">Friday</option>
            <option value="saturday">Saturday</option>
            <option value="sunday">Sunday</option>
        </select>

        <button type="submit">Save Week Start</button>
    </form>
</div>

</body>
</html>
