{% extends "base.html" %}

{% block content %}

<div class="info-section">
    <h3>Create Enthusiast Account</h3>

    <label>First Name</label>
    <input type="text" id="first_name" required>

    <label>Last Name</label>
    <input type="text" id="last_name" required>

    <label>Email</label>
    <input type="email" id="enthusiast_email" required>

    <label>Date of Birth</label>
    <input type="date" id="enthusiast_dob" required>

    <label>Password</label>
    <input type="password" id="enthusiast_password" required>

    <button class="btn" onclick="registerEnthusiast()">Create Account</button>
</div>

<script>
async function registerEnthusiast() {
    const response = await fetch("/api/register/enthusiast", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            first_name: document.getElementById("first_name").value,
            last_name: document.getElementById("last_name").value,
            email: document.getElementById("enthusiast_email").value,
            password: document.getElementById("enthusiast_password").value,
            date_of_birth: document.getElementById("enthusiast_dob").value
        })
    });

    const result = await response.json();
    alert(result.message);

    if (result.message.includes("success")) {
        window.location.href = "/enthusiast_login";
    }
}
</script>

{% endblock %}
