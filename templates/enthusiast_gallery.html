{% extends "base.html" %}
{% block content %}

<a href="javascript:history.back()" class="back-btn">← Back</a>
<div style="display:flex; justify-content:flex-end; margin:15px 0;">
    <a href="{{ url_for('enthusiast_hub') }}" class="btn btn-secondary">
        Back to Enthusiast Hub
    </a>
</div>


<h2>Enthusiast Photo Gallery</h2>

<form method="get" class="filter-bar" 
      style="display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end;">

    <!-- MONTH -->
    <div style="width:150px;">
        <label><strong>Month</strong></label>
        <select name="month" class="form-control">
            <option value="">All</option>
            {% for m_num, m_name in month_list %}
                <option value="{{ m_num }}"
                    {% if request.args.get('month')|int == m_num %}selected{% endif %}>
                    {{ m_name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- YEAR -->
    <div style="width:150px;">
        <label><strong>Year</strong></label>
        <select name="year" class="form-control">
            <option value="">All</option>
            {% for y in range(2000, 2051) %}
                <option value="{{ y }}"
                    {% if request.args.get('year')|int == y %}selected{% endif %}>
                    {{ y }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- USER -->
    <div style="width:180px;">
        <label><strong>User</strong></label>
        <select name="user" class="form-control">
            <option value="me"
                {% if request.args.get('user') == 'me' %}selected{% endif %}>
                Only My Photos
            </option>
            <option value="all"
                {% if request.args.get('user') == 'all' %}selected{% endif %}>
                All Users
            </option>
            {% for u in user_list %}
                <option value="{{ u.username }}"
                    {% if request.args.get('user') == u.username %}selected{% endif %}>
                    {{ u.username }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- DATE TYPE -->
    <div style="width:180px;">
        <label><strong>Date Type</strong></label>
        <select name="date_type" class="form-control">
            <option value="created"
                {% if request.args.get('date_type') == 'created' %}selected{% endif %}>
                Date Created
            </option>
            <option value="spotted"
                {% if request.args.get('date_type') == 'spotted' %}selected{% endif %}>
                Date Spotted
            </option>
        </select>
    </div>

    <!-- SORT -->
    <div style="width:150px;">
        <label><strong>Sort</strong></label>
        <select name="sort" class="form-control">
            <option value="newest"
                {% if request.args.get('sort') == 'newest' %}selected{% endif %}>
                Newest First
            </option>
            <option value="oldest"
                {% if request.args.get('sort') == 'oldest' %}selected{% endif %}>
                Oldest First
            </option>
        </select>
    </div>

    <!-- OPERATOR -->
    <div style="width:180px;">
        <label><strong>Operator</strong></label>
        <select name="operator" class="form-control">
            <option value="">All Operators</option>
            {% for op in operator_list %}
                <option value="{{ op }}"
                    {% if request.args.get('operator') == op %}selected{% endif %}>
                    {{ op }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- DEPOT -->
    <div style="width:180px;">
        <label><strong>Depot</strong></label>
        <select name="depot" class="form-control">
            <option value="">All Depots</option>
            {% for d in depot_list %}
                <option value="{{ d }}"
                    {% if request.args.get('depot') == d %}selected{% endif %}>
                    {{ d }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- ROUTE -->
    <div style="width:180px;">
        <label><strong>Route</strong></label>
        <select name="route" class="form-control">
            <option value="">All Routes</option>
            {% for r in route_list %}
                <option value="{{ r }}"
                    {% if request.args.get('route') == r %}selected{% endif %}>
                    {{ r }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- BUTTON ROW -->
    <div style="width:100%; margin-top:10px; display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary">Filter</button>
        <a href="/enthusiast/gallery" class="btn btn-secondary">Clear Filters</a>
    </div>

</form>

<!-- GAP BEFORE GALLERY -->
<div style="height:20px;"></div>








<div class="gallery-grid">
    {% for item in gallery_items %}
        <div class="gallery-card">

            <img src="{{ url_for('static', filename='enthusiast_photos/' ~ item.photo.filename) }}"
                 class="thumbnail">

            <div class="gallery-info">
                <strong>{{ item.enthusiast.username }}</strong><br>
                <small>{{ item.photo.uploaded_at.strftime('%d/%m/%Y %H:%M') }}</small>
            </div>

            <a href="{{ url_for('enthusiast_photo_details', photo_id=item.photo.id) }}"
               class="btn gallery-btn">
               View Details
            </a>

        </div>
    {% endfor %}
</div>


<style>
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 25px;
}

.gallery-card {
    background: #f7f9fc;
    border: 2px solid #1E88E5;
    border-radius: 8px;
    padding: 15px;
    text-align: center;
    box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
}

.thumbnail {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 10px;
}

.gallery-info p,
.gallery-info small {
    margin: 3px 0;
}

.gallery-btn {
    display: inline-block;
    margin-top: 10px;
    background-color: #1E88E5;
    color: white;
    padding: 8px 14px;
    border-radius: 6px;
    text-decoration: none;
}

.gallery-btn:hover {
    background-color: #1565C0;
}


.breadcrumbs {
    margin-bottom: 20px;
    font-size: 16px;
}
.breadcrumbs a {
    color: #1E88E5;
    text-decoration: none;
}
.breadcrumbs a:hover {
    text-decoration: underline;
}
.breadcrumbs span {
    color: #333;
}
</style>

{% endblock %}
